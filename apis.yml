aid: gengo
name: Gengo
description: >-
  Gengo is a people-powered translation platform that delivers fast, affordable, high-quality
  human translation in every major language through a global network of thousands of certified
  translators. The Gengo API (v2) lets developers order translation programmatically: submit text
  or file jobs, group them into orders, run cost quotes, look up supported language pairs and tiers,
  manage glossaries, retrieve completed translations and revisions, exchange comments with
  translators, and receive job-status updates through per-job callback URLs. Authentication uses a
  public API key plus an HMAC-SHA1 request signature, with a full sandbox for testing. Gengo was
  surfaced as a portfolio company of 500 Global and Point Nine and enriched into the API Evangelist
  network.
