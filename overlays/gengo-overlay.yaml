overlay: 1.0.0
info:
  title: API Evangelist enhancements for Gengo API
  version: 1.0.0
extends: openapi/gengo-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-07-19'
      x-apievangelist-source: https://developers.gengo.com/v2/api_methods/
      x-authentication: openapi + custom HMAC-SHA1 signature (see authentication/gengo-authentication.yml)
  - target: $.info
    update:
      x-artifacts:
        errors: errors/gengo-error-codes.yml
        conventions: conventions/gengo-conventions.yml
        lifecycle: lifecycle/gengo-lifecycle.yml
        webhooks: asyncapi/gengo-callbacks-webhooks.yml
        data_model: data-model/gengo-data-model.yml
        sandbox: sandbox/gengo-sandbox.yml
  - target: $.tags
    update:
      - name: Account
        x-agent-note: Read-only account and balance operations.
      - name: Jobs
        x-agent-note: Primary translation-ordering surface; submit via POST /translate/jobs.
